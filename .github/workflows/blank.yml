name: Virtual Gaming PC

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    name: deploy-rdp
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SYSTEM INFORMATION
      # ==========================================
      - name: System Information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "       VIRTUAL GAMING PC"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host "$([math]::Round($ram.TotalPhysicalMemory / 1GB, 2)) GB"

          Write-Host ""
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name

      # ==========================================
      # 3. ENABLE RDP
      # ==========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService"

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled."

      # ==========================================
      # 4. CREATE WINDOWS USER
      # ==========================================
      - name: Create User Account
        shell: powershell
        run: |

          Write-Host "Creating PCGamer account..."

          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $symbols = "!@#$%"

          $passwordChars = @()

          $passwordChars += $upper[
            (Get-Random -Maximum $upper.Length)
          ]

          $passwordChars += $lower[
            (Get-Random -Maximum $lower.Length)
          ]

          $passwordChars += $numbers[
            (Get-Random -Maximum $numbers.Length)
          ]

          $passwordChars += $symbols[
            (Get-Random -Maximum $symbols.Length)
          ]

          $allChars = $upper + $lower + $numbers + $symbols

          1..12 | ForEach-Object {
              $passwordChars += $allChars[
                (Get-Random -Maximum $allChars.Length)
              ]
          }

          $password = -join (
            $passwordChars | Sort-Object { Get-Random }
          )

          # Hide password in GitHub logs
          Write-Output "::add-mask::$password"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name "PCGamer" `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                -Name "PCGamer" `
                -Password $securePassword `
                -Description "Virtual Gaming PC"

          } else {

              Set-LocalUser `
                -Name "PCGamer" `
                -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "PCGamer" `
            -ErrorAction SilentlyContinue

          "PC_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "PCGamer account created."

      # ==========================================
      # 5. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          Write-Host "Downloading Tailscale..."

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi `
            -UseBasicParsing

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed."

      # ==========================================
      # 6. CONNECT TAILSCALE
      # ==========================================
      - name: Start Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Error "TS_AUTHKEY secret is missing."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale was not found."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="virtual-gaming-pc"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale connected."

      # ==========================================
      # 7. GET TAILSCALE IP
      # ==========================================
      - name: Get Tailscale IP
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IP was not obtained."
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       TAILSCALE IP"
          Write-Host "======================================"
          Write-Host ""
          Write-Host $ip
          Write-Host ""

      # ==========================================
      # 8. INSTALL SUNSHINE
      # ==========================================
      - name: Install Sunshine
        shell: powershell
        run: |

          Write-Host "Downloading Sunshine..."

          $version = "2026.914.233613"

          $url = "https://github.com/LizardByte/Sunshine/releases/download/v$version/Sunshine-Windows-AMD64-installer.msi"

          $msi = "$env:TEMP\Sunshine.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi `
            -UseBasicParsing

          Write-Host "Installing Sunshine..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Sunshine installation failed. Exit code: $($process.ExitCode)"
              exit 1
          }

          Write-Host "Sunshine installed successfully."

      # ==========================================
      # 9. CONFIGURE SUNSHINE
      # ==========================================
      - name: Configure Sunshine
        shell: powershell
        run: |

          $sunshine = "C:\Program Files\Sunshine\sunshine.exe"

          if (-not (Test-Path $sunshine)) {
              Write-Error "Sunshine executable was not found."
              exit 1
          }

          Write-Host "Generating Sunshine credentials..."

          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $symbols = "!@#$%"

          $sunshinePassword = @()

          $sunshinePassword += $upper[
            (Get-Random -Maximum $upper.Length)
          ]

          $sunshinePassword += $lower[
            (Get-Random -Maximum $lower.Length)
          ]

          $sunshinePassword += $numbers[
            (Get-Random -Maximum $numbers.Length)
          ]

          $sunshinePassword += $symbols[
            (Get-Random -Maximum $symbols.Length)
          ]

          $all = $upper + $lower + $numbers + $symbols

          1..12 | ForEach-Object {
              $sunshinePassword += $all[
                (Get-Random -Maximum $all.Length)
              ]
          }

          $sunshinePassword = -join (
            $sunshinePassword | Sort-Object { Get-Random }
          )

          Write-Output "::add-mask::$sunshinePassword"

          # Stop Sunshine service temporarily
          $service = Get-Service `
            -Name "SunshineService" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Stop-Service `
                -Name "SunshineService" `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
          }

          # Create Sunshine credentials
          & $sunshine `
            --creds `
            "PCGamer" `
            "$sunshinePassword"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Could not configure Sunshine credentials."
              exit 1
          }

          "SUNSHINE_PASSWORD=$sunshinePassword" >> $env:GITHUB_ENV

          Write-Host "Sunshine credentials configured."

      # ==========================================
      # 10. START SUNSHINE
      # ==========================================
      - name: Start Sunshine
        shell: powershell
        run: |

          Write-Host "Starting Sunshine..."

          $service = Get-Service `
            -Name "SunshineService" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Set-Service `
                -Name "SunshineService" `
                -StartupType Automatic

              Start-Service `
                -Name "SunshineService"

              Start-Sleep -Seconds 8

              Write-Host "Sunshine service started."

          } else {

              Write-Host "Sunshine service not found."

              Start-Process `
                "C:\Program Files\Sunshine\sunshine.exe"

              Start-Sleep -Seconds 8
          }

      # ==========================================
      # 11. SUNSHINE FIREWALL
      # ==========================================
      - name: Configure Sunshine Firewall
        shell: powershell
        run: |

          Write-Host "Configuring Sunshine firewall..."

          $portsTCP = @(
            47984,
            47989,
            47990,
            48010
          )

          foreach ($port in $portsTCP) {

              New-NetFirewallRule `
                -DisplayName "Sunshine Tailscale TCP $port" `
                -Direction Inbound `
                -Action Allow `
                -Protocol TCP `
                -LocalPort $port `
                -RemoteAddress "100.64.0.0/10" `
                -ErrorAction SilentlyContinue
          }

          $portsUDP = @(
            47998,
            47999,
            48000
          )

          foreach ($port in $portsUDP) {

              New-NetFirewallRule `
                -DisplayName "Sunshine Tailscale UDP $port" `
                -Direction Inbound `
                -Action Allow `
                -Protocol UDP `
                -LocalPort $port `
                -RemoteAddress "100.64.0.0/10" `
                -ErrorAction SilentlyContinue
          }

          Write-Host "Sunshine firewall configured."

      # ==========================================
      # 12. INSTALL STEAM
      # ==========================================
      - name: Install Steam
        shell: powershell
        run: |

          Write-Host "Checking Steam..."

          $steamPaths = @(
            "${env:ProgramFiles(x86)}\Steam\steam.exe",
            "${env:ProgramFiles}\Steam\steam.exe"
          )

          $steam = $steamPaths | Where-Object {
            Test-Path $_
          }

          if ($steam) {

              Write-Host "Steam is already installed."

          } else {

              Write-Host "Installing Steam..."

              winget install `
                --id Valve.Steam `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Steam installation failed."
                  exit 1
              }

              Write-Host "Steam installed."
          }

      # ==========================================
      # 13. VERIFY SUNSHINE
      # ==========================================
      - name: Verify Sunshine
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       SUNSHINE STATUS"
          Write-Host "======================================"

          $service = Get-Service `
            -Name "SunshineService" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Write-Host "Service: $($service.Status)"

          } else {

              Write-Host "Sunshine service was not detected."
          }

          Write-Host ""
          Write-Host "Testing port 47990..."

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 47990 `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {
              Write-Host "Sunshine Web UI: ONLINE"
          } else {
              Write-Host "Sunshine Web UI: NOT RESPONDING"
          }

      # ==========================================
      # 14. CONNECTION DETAILS
      # ==========================================
      - name: Connection Details
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       VIRTUAL GAMING PC ONLINE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Moonlight PC:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Sunshine Web UI:"
          Write-Host "https://$ip`:47990"

          Write-Host ""
          Write-Host "RDP:"
          Write-Host "$ip`:3389"

          Write-Host ""
          Write-Host "Windows Username:"
          Write-Host "PCGamer"

          Write-Host ""
          Write-Host "Windows Password:"
          Write-Host $env:PC_PASSWORD

          Write-Host ""
          Write-Host "Sunshine Username:"
          Write-Host "PCGamer"

          Write-Host ""
          Write-Host "Sunshine Password:"
          Write-Host $env:SUNSHINE_PASSWORD

          Write-Host ""
          Write-Host "=============================================="

          @"
          # 🎮 Virtual Gaming PC

          **Status:** 🟢 Online

          **Tailscale IP:** `$ip`

          ## Moonlight

          Add this PC manually:

          `$ip`

          ## Sunshine

          Web UI:

          `https://$ip`:47990

          ## Windows RDP

          Address:

          `$ip`:3389

          Username:

          `PCGamer`

          Password:

          `$env:PC_PASSWORD`

          ## Sunshine

          Username:

          `PCGamer`

          Password:

          `$env:SUNSHINE_PASSWORD`

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append

      # ==========================================
      # 15. KEEP PC RUNNING
      # ==========================================
      - name: Keep PC Running
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "     VIRTUAL GAMING PC IS RUNNING"
          Write-Host "======================================"
          Write-Host ""

          while ($true) {

              Write-Host "PC ACTIVE: $(Get-Date)"

              Start-Sleep -Seconds 60
          }
