name: Virtual Gaming PC

on:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # PC VIRTUAL
      # ==========================================
      - name: Start Virtual PC
        run: |
          echo "======================================"
          echo "       VIRTUAL GAMING PC"
          echo "======================================"

          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "SYSTEM:"
          uname -a

      # ==========================================
      # INSTALAR AMBIENTE GRÁFICO
      # ==========================================
      - name: Install Desktop Environment
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            dbus-x11 \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            nginx \
            apache2-utils \
            curl \
            wget \
            unzip \
            git \
            pulseaudio \
            pavucontrol \
            mesa-utils \
            pciutils

      # ==========================================
      # INSTALAR STEAM
      # ==========================================
      - name: Install Steam
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            steam-installer

          echo "Steam installed."

      # ==========================================
      # CRIAR USUÁRIO
      # ==========================================
      - name: Create PC User
        run: |
          if ! id pc >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash pc
          fi

          sudo usermod -aG sudo pc

          sudo mkdir -p /home/pc
          sudo chown -R pc:pc /home/pc

      # ==========================================
      # CONFIGURAR XFCE
      # ==========================================
      - name: Configure XFCE
        run: |
          sudo -u pc mkdir -p /home/pc/.config/xfce4

          sudo tee /home/pc/.xinitrc > /dev/null <<'EOF'
          #!/bin/bash

          export DISPLAY=:1
          export XDG_CURRENT_DESKTOP=XFCE

          startxfce4
          EOF

          sudo chmod +x /home/pc/.xinitrc
          sudo chown pc:pc /home/pc/.xinitrc

      # ==========================================
      # TAILSCALE
      # ==========================================
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          echo "Tailscale installed."

      # ==========================================
      # CONECTAR TAILSCALE
      # ==========================================
      - name: Connect Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          if [ -z "$TS_AUTHKEY" ]; then
            echo "ERROR: TS_AUTHKEY secret is missing."
            exit 1
          fi

          sudo tailscale up \
            --auth-key="$TS_AUTHKEY" \
            --hostname=virtual-gaming-pc

          sleep 5

      # ==========================================
      # MOSTRAR IP TAILSCALE
      # ==========================================
      - name: Show Tailscale IP
        run: |
          echo
          echo "======================================"
          echo "       TAILSCALE INFORMATION"
          echo "======================================"

          echo
          echo "TAILSCALE IPv4:"
          sudo tailscale ip -4

          echo
          echo "TAILSCALE STATUS:"
          sudo tailscale status

          echo
          echo "======================================"

      # ==========================================
      # CONFIGURAR NOVNC
      # ==========================================
      - name: Configure NoVNC
        run: |
          sudo mkdir -p /opt/virtual-pc

          sudo tee /opt/virtual-pc/start.sh > /dev/null <<'EOF'
          #!/bin/bash

          export DISPLAY=:1

          # Virtual display
          Xvfb :1 \
            -screen 0 1920x1080x24 \
            -ac &

          sleep 5

          # XFCE desktop
          sudo -u pc DISPLAY=:1 startxfce4 &

          sleep 10

          # VNC server
          x11vnc \
            -display :1 \
            -forever \
            -shared \
            -rfbport 5900 \
            -nopw &

          sleep 3

          # NoVNC
          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 &
          EOF

          sudo chmod +x /opt/virtual-pc/start.sh

      # ==========================================
      # SENHA DO NOVNC
      # ==========================================
      - name: Configure Web Password
        env:
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
        run: |
          if [ -z "$WEB_PASSWORD" ]; then
            echo "ERROR: WEB_PASSWORD secret is missing."
            exit 1
          fi

          sudo htpasswd -bc \
            /etc/nginx/.htpasswd \
            pc \
            "$WEB_PASSWORD"

      # ==========================================
      # NGINX
      # ==========================================
      - name: Configure Web Access
        run: |
          sudo tee /etc/nginx/sites-available/virtual-pc > /dev/null <<'EOF'
          server {
              listen 8080;

              auth_basic "Virtual Gaming PC";
              auth_basic_user_file /etc/nginx/.htpasswd;

              location / {
                  proxy_pass http://127.0.0.1:6080;

                  proxy_http_version 1.1;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";

                  proxy_set_header Host $host;
              }
          }
          EOF

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo ln -sf \
            /etc/nginx/sites-available/virtual-pc \
            /etc/nginx/sites-enabled/virtual-pc

          sudo nginx -t
          sudo systemctl restart nginx

      # ==========================================
      # INICIAR PC
      # ==========================================
      - name: Start Desktop
        run: |
          sudo /opt/virtual-pc/start.sh

          sleep 15

          echo
          echo "======================================"
          echo "       VIRTUAL PC ONLINE"
          echo "======================================"

      # ==========================================
      # INFORMAÇÕES
      # ==========================================
      - name: Show PC Information
        run: |
          echo
          echo "======================================"
          echo "       PC INFORMATION"
          echo "======================================"

          echo
          echo "CPU:"
          nproc

          echo
          echo "MEMORY:"
          free -h

          echo
          echo "DISK:"
          df -h /

          echo
          echo "GPU:"
          lspci | grep -Ei "vga|3d|display" || true

          echo
          echo "TAILSCALE IP:"
          sudo tailscale ip -4

          echo
          echo "NOVNC PORT:"
          echo "6080"

          echo
          echo "WEB PORT:"
          echo "8080"

          echo
          echo "======================================"

      # ==========================================
      # MANTER PC LIGADO
      # ==========================================
      - name: Keep PC Running
        run: |
          echo "Virtual Gaming PC is running."

          while true
          do
            echo "PC ACTIVE: $(date)"
            sleep 60
          done
