name: PC Virtual Gamer

on:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

      - name: Iniciar PC
        run: |
          echo "======================================"
          echo "       PC VIRTUAL GAMER INICIADO"
          echo "======================================"

          echo "CPU:"
          nproc

          echo
          echo "MEMÓRIA:"
          free -h

          echo
          echo "SISTEMA:"
          uname -a

      - name: Instalar ambiente gráfico
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xfce4-terminal \
            dbus-x11 \
            xvfb \
            x11vnc \
            novnc \
            websockify \
            nginx \
            apache2-utils \
            curl \
            wget \
            unzip \
            git \
            pulseaudio \
            pavucontrol \
            mesa-utils \
            vulkan-tools

      - name: Instalar Steam
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            steam-installer

      - name: Criar usuário do PC
        run: |
          if ! id pc >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash pc
          fi

          sudo usermod -aG sudo pc

          sudo mkdir -p /home/pc
          sudo chown -R pc:pc /home/pc

      - name: Configurar XFCE
        run: |
          sudo -u pc bash -c 'mkdir -p /home/pc/.config/xfce4'

          sudo -u pc bash -c 'cat > /home/pc/.xinitrc <<EOF
          #!/bin/bash
          export DISPLAY=:1
          export XDG_CURRENT_DESKTOP=XFCE
          export XDG_CONFIG_DIRS=/etc/xdg/xdg-xfce:/etc/xdg
          startxfce4
          EOF'

          sudo chmod +x /home/pc/.xinitrc

      - name: Criar senha do acesso web
        run: |
          sudo htpasswd -bc \
            /etc/nginx/.htpasswd \
            pc \
            "${{ secrets.WEB_PASSWORD }}"

      - name: Configurar NoVNC
        run: |
          sudo mkdir -p /opt/pc

          sudo tee /opt/pc/start-pc.sh > /dev/null <<'EOF'
          #!/bin/bash

          export DISPLAY=:1

          Xvfb :1 -screen 0 1920x1080x24 &
          sleep 3

          sudo -u pc startxfce4 &

          sleep 5

          x11vnc \
            -display :1 \
            -forever \
            -shared \
            -rfbport 5900 \
            -nopw &

          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5900 &
          EOF

          sudo chmod +x /opt/pc/start-pc.sh

      - name: Configurar Nginx
        run: |
          sudo tee /etc/nginx/sites-available/pc > /dev/null <<'EOF'
          server {
              listen 8080;

              auth_basic "PC Virtual";
              auth_basic_user_file /etc/nginx/.htpasswd;

              location / {
                  proxy_pass http://127.0.0.1:6080;

                  proxy_http_version 1.1;

                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";

                  proxy_set_header Host $host;
              }
          }
          EOF

          sudo rm -f /etc/nginx/sites-enabled/default

          sudo ln -sf \
            /etc/nginx/sites-available/pc \
            /etc/nginx/sites-enabled/pc

          sudo nginx -t
          sudo systemctl restart nginx

      - name: Iniciar interface
        run: |
          sudo /opt/pc/start-pc.sh

          sleep 10

          echo
          echo "======================================"
          echo "       INTERFACE DO PC INICIADA"
          echo "======================================"

          echo
          echo "PORTA NOVNC: 6080"
          echo "PORTA WEB: 8080"

      - name: Informações do PC
        run: |
          echo
          echo "======================================"
          echo "       INFORMAÇÕES DO PC"
          echo "======================================"

          echo
          echo "CPU:"
          nproc

          echo
          echo "MEMÓRIA:"
          free -h

          echo
          echo "DISCO:"
          df -h /

          echo
          echo "GPU:"
          lspci | grep -Ei "vga|3d|display" || true

          echo
          echo "======================================"
          echo "       PC VIRTUAL ONLINE"
          echo "======================================"

      - name: Manter PC ligado
        run: |
          echo "PC Virtual Gamer está ativo."

          while true
          do
            echo "PC ativo: $(date)"
            sleep 60
          done
