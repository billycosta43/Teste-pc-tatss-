name: Virtual Gaming PC

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    name: deploy-rdp
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SYSTEM INFORMATION
      # ==========================================
      - name: System Information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "       SYSTEM INFORMATION"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host "$([math]::Round($ram.TotalPhysicalMemory / 1GB, 2)) GB"

          Write-Host ""
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name

      # ==========================================
      # 3. ENABLE RDP
      # ==========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService"

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled."

      # ==========================================
      # 4. CREATE USER + AUTOMATIC PASSWORD
      # ==========================================
      - name: Create User Account
        shell: powershell
        run: |

          Write-Host "Creating PCGamer account..."

          $chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%'

          $password = -join (
            1..16 | ForEach-Object {
              $chars[(Get-Random -Maximum $chars.Length)]
            }
          )

          # Mask password from normal GitHub log output
          Write-Output "::add-mask::$password"

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name "PCGamer" `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                -Name "PCGamer" `
                -Password $securePassword `
                -Description "Virtual Gaming PC"

          } else {

              Set-LocalUser `
                -Name "PCGamer" `
                -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "PCGamer" `
            -ErrorAction SilentlyContinue

          # Save password for following steps
          "PC_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "PCGamer account created."

      # ==========================================
      # 5. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale (Silent)
        shell: powershell
        run: |

          Write-Host "Downloading Tailscale..."

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          $msi = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi `
            -UseBasicParsing

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed. Exit code: $($process.ExitCode)"
              exit 1
          }

          Write-Host "Tailscale installed."

      # ==========================================
      # 6. START TAILSCALE
      # ==========================================
      - name: Start Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Error "TS_AUTHKEY secret is missing."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable was not found."
              exit 1
          }

          Write-Host "Connecting to Tailscale..."

          & $tailscale up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="virtual-gaming-pc"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Start-Sleep -Seconds 5

          Write-Host ""
          Write-Host "Tailscale status:"
          & $tailscale status

      # ==========================================
      # 7. GET TAILSCALE IP
      # ==========================================
      - name: Get Tailscale IP
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Could not obtain Tailscale IP."
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       TAILSCALE IP"
          Write-Host "======================================"
          Write-Host ""
          Write-Host $ip
          Write-Host ""
          Write-Host "======================================"

      # ==========================================
      # 8. RESTRICT RDP TO TAILSCALE
      # ==========================================
      - name: Configure RDP Firewall
        shell: powershell
        run: |

          Write-Host "Configuring RDP firewall..."

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule `
            -RemoteAddress "100.64.0.0/10"

          Write-Host "RDP restricted to Tailscale."

      # ==========================================
      # 9. INSTALL GOOGLE CHROME
      # ==========================================
      - name: Install Google Chrome (Direct)
        shell: powershell
        run: |

          Write-Host "Installing Google Chrome..."

          winget install `
            --id Google.Chrome `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Chrome installed."

      # ==========================================
      # 10. INSTALL 7-ZIP
      # ==========================================
      - name: Install 7-Zip (Direct)
        shell: powershell
        run: |

          Write-Host "Installing 7-Zip..."

          winget install `
            --id 7zip.7zip `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "7-Zip installed."

      # ==========================================
      # 11. INSTALL STEAM
      # ==========================================
      - name: Install Steam
        shell: powershell
        run: |

          Write-Host "Installing Steam..."

          winget install `
            --id Valve.Steam `
            --exact `
            --silent `
            --accept-package-agreements `
            --accept-source-agreements

          Write-Host "Steam installation finished."

      # ==========================================
      # 12. CONNECTION DETAILS
      # ==========================================
      - name: Connection Details
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       VIRTUAL GAMING PC ONLINE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Computer:"
          Write-Host "virtual-gaming-pc"

          Write-Host ""
          Write-Host "Tailscale IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "RDP address:"
          Write-Host "$ip`:3389"

          Write-Host ""
          Write-Host "Username:"
          Write-Host "PCGamer"

          Write-Host ""
          Write-Host "Password:"
          Write-Host $env:PC_PASSWORD

          Write-Host ""
          Write-Host "=============================================="

          # Add connection information to GitHub Summary
          @"
          # 🎮 Virtual Gaming PC

          ## Connection

          **Computer:** `virtual-gaming-pc`

          **Tailscale IP:** `$ip`

          **RDP Address:** `$ip`:3389

          **Username:** `PCGamer`

          **Password:** `$env:PC_PASSWORD`

          ## Status

          🟢 PC Online

          🟢 RDP Enabled

          🟢 Tailscale Connected

          🟢 Steam Installed

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append

      # ==========================================
      # 13. KEEP PC RUNNING
      # ==========================================
      - name: Keep PC Running
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "     VIRTUAL GAMING PC IS RUNNING"
          Write-Host "======================================"
          Write-Host ""
          Write-Host "Do not cancel this workflow."
          Write-Host ""

          while ($true) {

              Write-Host "PC ACTIVE: $(Get-Date)"

              Start-Sleep -Seconds 60
          }
