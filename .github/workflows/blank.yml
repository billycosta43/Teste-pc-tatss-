name: Virtual Gaming PC

on:
  workflow_dispatch:

jobs:
  deploy-rdp:
    name: deploy-rdp
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. SYSTEM INFORMATION
      # ==========================================
      - name: System Information
        shell: powershell
        run: |
          Write-Host "======================================"
          Write-Host "       VIRTUAL GAMING PC"
          Write-Host "======================================"

          Write-Host ""
          Write-Host "CPU:"
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

          Write-Host ""
          Write-Host "RAM:"
          $ram = Get-CimInstance Win32_ComputerSystem
          Write-Host "$([math]::Round($ram.TotalPhysicalMemory / 1GB, 2)) GB"

          Write-Host ""
          Write-Host "GPU:"
          Get-CimInstance Win32_VideoController |
            Select-Object Name

      # ==========================================
      # 3. ENABLE RDP
      # ==========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0

          Set-Service `
            -Name "TermService" `
            -StartupType Automatic

          Start-Service `
            -Name "TermService"

          Enable-NetFirewallRule `
            -DisplayGroup "Remote Desktop"

          Write-Host "RDP enabled."

      # ==========================================
      # 4. CREATE WINDOWS USER + PASSWORD
      # ==========================================
      - name: Create User Account
        shell: powershell
        run: |

          Write-Host "Creating PCGamer account..."

          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $symbols = "!@#$%"

          $passwordChars = @()

          $passwordChars += $upper[
            (Get-Random -Maximum $upper.Length)
          ]

          $passwordChars += $lower[
            (Get-Random -Maximum $lower.Length)
          ]

          $passwordChars += $numbers[
            (Get-Random -Maximum $numbers.Length)
          ]

          $passwordChars += $symbols[
            (Get-Random -Maximum $symbols.Length)
          ]

          $allChars = $upper + $lower + $numbers + $symbols

          1..12 | ForEach-Object {
              $passwordChars += $allChars[
                (Get-Random -Maximum $allChars.Length)
              ]
          }

          $password = -join (
            $passwordChars | Sort-Object { Get-Random }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existingUser = Get-LocalUser `
            -Name "PCGamer" `
            -ErrorAction SilentlyContinue

          if ($null -eq $existingUser) {

              New-LocalUser `
                -Name "PCGamer" `
                -Password $securePassword `
                -Description "Virtual Gaming PC"

          } else {

              Set-LocalUser `
                -Name "PCGamer" `
                -Password $securePassword
          }

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "PCGamer" `
            -ErrorAction SilentlyContinue

          "PC_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "Windows account created."

      # ==========================================
      # 5. INSTALL TAILSCALE
      # ==========================================
      - name: Install Tailscale
        shell: powershell
        run: |

          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"

          $msi = "$env:TEMP\tailscale.msi"

          Write-Host "Downloading Tailscale..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi `
            -UseBasicParsing

          Write-Host "Installing Tailscale..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Tailscale installation failed."
              exit 1
          }

          Write-Host "Tailscale installed."

      # ==========================================
      # 6. CONNECT TAILSCALE
      # ==========================================
      - name: Start Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |

          if ([string]::IsNullOrWhiteSpace($env:TS_AUTHKEY)) {
              Write-Error "TS_AUTHKEY secret is missing."
              exit 1
          }

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          Write-Host "Connecting Tailscale..."

          & $tailscale up `
            --auth-key="$env:TS_AUTHKEY" `
            --hostname="virtual-gaming-pc"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Tailscale connection failed."
              exit 1
          }

          Start-Sleep -Seconds 5

          Write-Host "Tailscale connected."

      # ==========================================
      # 7. GET TAILSCALE IP
      # ==========================================
      - name: Get Tailscale IP
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          if ([string]::IsNullOrWhiteSpace($ip)) {
              Write-Error "Tailscale IP was not obtained."
              exit 1
          }

          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "======================================"
          Write-Host "TAILSCALE IP:"
          Write-Host $ip
          Write-Host "======================================"

      # ==========================================
      # 8. INSTALL SUNSHINE
      # ==========================================
      - name: Install Sunshine
        shell: powershell
        run: |

          $version = "2026.914.233613"

          $url = "https://github.com/LizardByte/Sunshine/releases/download/v$version/Sunshine-Windows-AMD64-installer.msi"

          $msi = "$env:TEMP\Sunshine.msi"

          Write-Host "Downloading Sunshine v$version..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $msi `
            -UseBasicParsing

          Write-Host "Installing Sunshine..."

          $process = Start-Process `
            -FilePath "msiexec.exe" `
            -ArgumentList "/i `"$msi`" /qn /norestart" `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
              Write-Error "Sunshine installation failed. Exit code: $($process.ExitCode)"
              exit 1
          }

          Write-Host "Sunshine installed."

      # ==========================================
      # 9. CONFIGURE SUNSHINE
      # ==========================================
      - name: Configure Sunshine
        shell: powershell
        run: |

          $sunshine = "C:\Program Files\Sunshine\sunshine.exe"

          $configDir = "C:\Program Files\Sunshine\config"

          $configFile = "$configDir\sunshine.conf"

          if (-not (Test-Path $sunshine)) {
              Write-Error "Sunshine executable was not found."
              exit 1
          }

          New-Item `
            -ItemType Directory `
            -Path $configDir `
            -Force | Out-Null

          Write-Host "Preparing Sunshine configuration..."

          if (-not (Test-Path $configFile)) {
              New-Item `
                -ItemType File `
                -Path $configFile `
                -Force | Out-Null
          }

          $config = Get-Content `
            -Path $configFile `
            -Raw `
            -ErrorAction SilentlyContinue

          if ($null -eq $config) {
              $config = ""
          }

          function Set-SunshineOption {
              param(
                  [string]$Name,
                  [string]$Value
              )

              $current = Get-Content `
                -Path $configFile `
                -Raw `
                -ErrorAction SilentlyContinue

              if ($current -match "(?m)^\s*$([regex]::Escape($Name))\s*=") {

                  $current = [regex]::Replace(
                    $current,
                    "(?m)^\s*$([regex]::Escape($Name))\s*=.*$",
                    "$Name = $Value"
                  )

              } else {

                  if (-not $current.EndsWith("`n")) {
                      $current += "`r`n"
                  }

                  $current += "$Name = $Value`r`n"
              }

              Set-Content `
                -Path $configFile `
                -Value $current `
                -Encoding UTF8
          }

          # Allow the Web UI through the Tailscale-only firewall.
          Set-SunshineOption `
            -Name "origin_web_ui_allowed" `
            -Value "wan"

          # Allow Moonlight pairing through Tailscale.
          Set-SunshineOption `
            -Name "origin_pin_allowed" `
            -Value "wan"

          # Do not open ports automatically on the router.
          Set-SunshineOption `
            -Name "upnp" `
            -Value "disabled"

          Write-Host "Sunshine configuration prepared."

      # ==========================================
      # 10. GENERATE SUNSHINE PASSWORD
      # ==========================================
      - name: Generate Sunshine Password
        shell: powershell
        run: |

          $upper   = "ABCDEFGHJKLMNPQRSTUVWXYZ"
          $lower   = "abcdefghijkmnopqrstuvwxyz"
          $numbers = "23456789"
          $symbols = "!@#$%"

          $passwordChars = @()

          $passwordChars += $upper[
            (Get-Random -Maximum $upper.Length)
          ]

          $passwordChars += $lower[
            (Get-Random -Maximum $lower.Length)
          ]

          $passwordChars += $numbers[
            (Get-Random -Maximum $numbers.Length)
          ]

          $passwordChars += $symbols[
            (Get-Random -Maximum $symbols.Length)
          ]

          $allChars = $upper + $lower + $numbers + $symbols

          1..12 | ForEach-Object {
              $passwordChars += $allChars[
                (Get-Random -Maximum $allChars.Length)
              ]
          }

          $sunshinePassword = -join (
            $passwordChars | Sort-Object { Get-Random }
          )

          "SUNSHINE_PASSWORD=$sunshinePassword" >> $env:GITHUB_ENV

          Write-Host "Sunshine password generated."

      # ==========================================
      # 11. SET SUNSHINE CREDENTIALS
      # ==========================================
      - name: Set Sunshine Credentials
        shell: powershell
        run: |

          $sunshine = "C:\Program Files\Sunshine\sunshine.exe"

          $service = Get-Service `
            -Name "SunshineService" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Write-Host "Stopping Sunshine service..."

              Stop-Service `
                -Name "SunshineService" `
                -Force `
                -ErrorAction SilentlyContinue

              Start-Sleep -Seconds 3
          }

          Write-Host "Setting Sunshine Web UI credentials..."

          & $sunshine `
            --creds `
            "PCGamer" `
            "$env:SUNSHINE_PASSWORD"

          if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to set Sunshine credentials."
              exit 1
          }

          Write-Host "Sunshine credentials configured."

      # ==========================================
      # 12. START SUNSHINE
      # ==========================================
      - name: Start Sunshine
        shell: powershell
        run: |

          Write-Host "Starting Sunshine..."

          $service = Get-Service `
            -Name "SunshineService" `
            -ErrorAction SilentlyContinue

          if ($service) {

              Set-Service `
                -Name "SunshineService" `
                -StartupType Automatic

              Start-Service `
                -Name "SunshineService"

              Start-Sleep -Seconds 10

          } else {

              Write-Host "Sunshine service not found."

              Start-Process `
                "C:\Program Files\Sunshine\sunshine.exe"

              Start-Sleep -Seconds 10
          }

          Write-Host "Sunshine started."

      # ==========================================
      # 13. SUNSHINE FIREWALL
      # ==========================================
      - name: Configure Sunshine Firewall
        shell: powershell
        run: |

          Write-Host "Configuring Sunshine firewall..."

          # TCP
          $tcpPorts = @(
            47984,
            47989,
            47990,
            48010
          )

          foreach ($port in $tcpPorts) {

              New-NetFirewallRule `
                -DisplayName "Sunshine Tailscale TCP $port" `
                -Direction Inbound `
                -Action Allow `
                -Protocol TCP `
                -LocalPort $port `
                -RemoteAddress "100.64.0.0/10" `
                -ErrorAction SilentlyContinue
          }

          # UDP
          $udpPorts = @(
            47998,
            47999,
            48000
          )

          foreach ($port in $udpPorts) {

              New-NetFirewallRule `
                -DisplayName "Sunshine Tailscale UDP $port" `
                -Direction Inbound `
                -Action Allow `
                -Protocol UDP `
                -LocalPort $port `
                -RemoteAddress "100.64.0.0/10" `
                -ErrorAction SilentlyContinue
          }

          Write-Host "Sunshine firewall configured."

      # ==========================================
      # 14. RESTRICT RDP TO TAILSCALE
      # ==========================================
      - name: Configure RDP Firewall
        shell: powershell
        run: |

          Get-NetFirewallRule `
            -DisplayGroup "Remote Desktop" |
            Set-NetFirewallRule `
            -RemoteAddress "100.64.0.0/10"

          Write-Host "RDP restricted to Tailscale."

      # ==========================================
      # 15. INSTALL STEAM
      # ==========================================
      - name: Install Steam
        shell: powershell
        run: |

          $steamPaths = @(
            "${env:ProgramFiles(x86)}\Steam\steam.exe",
            "${env:ProgramFiles}\Steam\steam.exe"
          )

          $steam = $steamPaths |
            Where-Object {
              Test-Path $_
            }

          if ($steam) {

              Write-Host "Steam is already installed."

          } else {

              Write-Host "Installing Steam..."

              winget install `
                --id Valve.Steam `
                --exact `
                --silent `
                --accept-package-agreements `
                --accept-source-agreements

              if ($LASTEXITCODE -ne 0) {
                  Write-Error "Steam installation failed."
                  exit 1
              }

              Write-Host "Steam installed."
          }

      # ==========================================
      # 16. VERIFY SUNSHINE
      # ==========================================
      - name: Verify Sunshine
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "       SUNSHINE STATUS"
          Write-Host "======================================"

          $service = Get-Service `
            -Name "SunshineService" `
            -ErrorAction SilentlyContinue

          if ($service) {
              Write-Host "Service status: $($service.Status)"
          } else {
              Write-Host "SunshineService not found."
          }

          Write-Host ""
          Write-Host "Testing Sunshine Web UI..."

          $test = Test-NetConnection `
            -ComputerName "127.0.0.1" `
            -Port 47990 `
            -WarningAction SilentlyContinue

          if ($test.TcpTestSucceeded) {
              Write-Host "Sunshine Web UI: ONLINE"
          } else {
              Write-Host "Sunshine Web UI: OFFLINE"
          }

      # ==========================================
      # 17. CONNECTION DETAILS
      # ==========================================
      - name: Connection Details
        shell: powershell
        run: |

          $tailscale = "C:\Program Files\Tailscale\tailscale.exe"

          $ip = (& $tailscale ip -4).Trim()

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       VIRTUAL GAMING PC ONLINE"
          Write-Host "=============================================="
          Write-Host ""

          Write-Host "Tailscale IP:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Moonlight Host:"
          Write-Host $ip

          Write-Host ""
          Write-Host "Sunshine Web UI:"
          Write-Host "https://$ip`:47990"

          Write-Host ""
          Write-Host "Windows Username:"
          Write-Host "PCGamer"

          Write-Host ""
          Write-Host "Windows Password:"
          Write-Host $env:PC_PASSWORD

          Write-Host ""
          Write-Host "Sunshine Username:"
          Write-Host "PCGamer"

          Write-Host ""
          Write-Host "Sunshine Password:"
          Write-Host $env:SUNSHINE_PASSWORD

          @"
          # 🎮 VIRTUAL GAMING PC

          ## 🟢 Status

          ONLINE

          ## 🌐 Tailscale

          **IP:**

          $ip

          ## 🎮 Moonlight

          **Host:**

          $ip

          ## ☀️ Sunshine

          **Web UI:**

          https://$ip`:47990

          **Username:**

          PCGamer

          **Password:**

          $env:SUNSHINE_PASSWORD

          ## 🖥️ Windows RDP

          **Address:**

          $ip`:3389

          **Username:**

          PCGamer

          **Password:**

          $env:PC_PASSWORD

          "@ | Out-File `
            -FilePath $env:GITHUB_STEP_SUMMARY `
            -Append

      # ==========================================
      # 18. KEEP PC RUNNING
      # ==========================================
      - name: Keep PC Running
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "======================================"
          Write-Host "   VIRTUAL GAMING PC IS RUNNING"
          Write-Host "======================================"
          Write-Host ""

          while ($true) {

              Write-Host "PC ACTIVE: $(Get-Date)"

              Start-Sleep -Seconds 60
          }
